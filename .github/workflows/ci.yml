name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          node -e "import('@astrojs/compiler').catch(() => process.exit(42))" || {
            echo "Astro native binding missing after npm ci; reinstalling cleanly..."
            rm -rf node_modules package-lock.json
            npm install
          }

      - name: Lint, typecheck, and test
        run: npm run check

      - name: Build
        run: npm run build
